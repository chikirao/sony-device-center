name: CI (Linux, Windows, macOS)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
      - 'refactor/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            artifact_name: sony-device-center-linux-x64
            install_deps: |
              sudo apt-get update
              # gdb: QtTest prints a crashing test's stack trace through it.
              sudo apt-get install -y libbluetooth-dev libglew-dev libglfw3-dev libdbus-1-dev qt6-base-dev qt6-declarative-dev libgl1-mesa-dev \
                qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-templates \
                qml6-module-qtquick-layouts qml6-module-qtquick-shapes qml6-module-qtquick-window \
                qml6-module-qtqml-workerscript gdb \
                xvfb xauth qt6-qpa-plugins libgl1-mesa-dri
              # Ubuntu only lets a process trace its own children; QtTest's crash
              # handler attaches gdb to itself, so allow any same-user process.
              sudo sysctl -w kernel.yama.ptrace_scope=0
            # UI suite on xcb under Xvfb (OpenGL through Mesa), not offscreen.
            cmake_args: "-DSONY_UI_TEST_QPA=xcb"
          - os: windows-latest
            artifact_name: sony-device-center-win-x64
            install_deps: ""
            cmake_args: ""
          - os: macos-latest
            artifact_name: sony-device-center-macos-x64
            install_deps: |
              brew install qt@6
            cmake_args: "-DCMAKE_PREFIX_PATH=$(brew --prefix qt@6)"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        if: matrix.install_deps != ''
        shell: bash
        run: |
          ${{ matrix.install_deps }}

      - name: Install Qt (Windows)
        if: runner.os == 'Windows'
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.10.*'
          arch: win64_msvc2022_64
          cache: true

      - name: Configure CMake
        shell: bash
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=${BUILD_TYPE} -DBUILD_TESTING=ON -DSONY_REQUIRE_QT=ON ${{ matrix.cmake_args }}

      - name: Build all targets
        shell: bash
        run: |
          cmake --build build --config ${BUILD_TYPE}

      # A failed test runs once more. On Linux the tests run inside Xvfb so the
      # UI suite renders through OpenGL: offscreen falls back to Qt 6.4's
      # software renderer, which crashed in QPainter::drawPixmap painting
      # resized Canvases, by #41 in most runs.
      - name: Run unit & protocol tests
        shell: bash
        run: |
          run=()
          if [ "$RUNNER_OS" = Linux ]; then run=(xvfb-run -a -s "-screen 0 1920x1080x24"); fi
          "${run[@]}" ctest --test-dir build -C ${BUILD_TYPE} --output-on-failure --no-tests=error --repeat until-pass:2

      # The Windows log does not carry the UI suite's output; the suite also
      # writes it to a file, kept here when something fails.
      - name: Upload UI test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-results-${{ matrix.os }}
          path: build/**/ui-test-results.txt
          if-no-files-found: ignore

      # The DMG is built on every push so packaging breakage shows up in the
      # PR, not at release time. It is also the download for macOS testers.
      - name: Build and verify the disk image (macOS)
        if: runner.os == 'macOS'
        run: |
          pipx install dmgbuild
          cmake --build build --target dmg
          packaging/macos/verify-dmg.sh build/*.dmg

      - name: Package artifacts
        shell: bash
        run: |
          mkdir -p staging
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            find build -name "*.exe" -exec cp {} staging/ \; || true
          elif [ "${{ matrix.os }}" = "macos-latest" ]; then
            cp build/*.dmg staging/
          else
            find build/apps -maxdepth 3 -type f -executable -exec cp {} staging/ \; || true
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: staging/
          if-no-files-found: ignore

  sanitizers:
    name: Sanitizers (Linux ASan & UBSan)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libglew-dev libglfw3-dev libdbus-1-dev qt6-base-dev qt6-declarative-dev libgl1-mesa-dev

      - name: Configure with ASan and UBSan
        run: |
          cmake -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_SANITIZERS=ON -DBUILD_TESTING=ON

      - name: Build tests with sanitizers
        run: |
          cmake --build build-asan --target sony-protocol-tests sony-transport-tests sony-core-tests sony-battery-history-tests sony-update-checker-tests sony-peripheral-tests

      # Only the library test targets and the headless battery-history,
      # update-checker and peripheral-model tests are built above, so the
      # app-level tests have no binary to start. The regular matrix job
      # covers them.
      - name: Run tests with sanitizers
        env:
          ASAN_OPTIONS: "detect_leaks=0:abort_on_error=1"
          UBSAN_OPTIONS: "print_stacktrace=1:halt_on_error=1"
        run: |
          ctest --test-dir build-asan --output-on-failure --no-tests=error \
            -E '^(simulated-app-smoke|device-controller-worker-integration)$'
